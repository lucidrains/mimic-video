[project]
name = "mimic-video"
version = "0.5.1"
description = "Mimic Video"
authors = [
    { name = "Phil Wang", email = "lucidrains@gmail.com" }
]
readme = "README.md"
requires-python = ">= 3.10"
license = { file = "LICENSE" }
keywords = [
    'artificial intelligence',
    'deep learning',
    'attention mechanism',
    'video language action model'
]

classifiers=[
    'Development Status :: 4 - Beta',
    'Intended Audience :: Developers',
    'Topic :: Scientific/Engineering :: Artificial Intelligence',
    'License :: OSI Approved :: MIT License',
    'Programming Language :: Python :: 3.10',
]

dependencies = [
    "assoc-scan",
    "einx>=0.4.0",
    "einops>=0.8.1",
    "ema-pytorch",
    "peft",
    "torch>=2.5",
    "torch-einops-utils>=0.1.19",
    "tqdm",
    "x-mlps-pytorch",
    "x-transformers>=2.24.1",
    "hl-gauss-pytorch>=0.2.7",
]

[project.urls]
Homepage = "https://pypi.org/project/mimic-video/"
Repository = "https://github.com/lucidrains/mimic-video"

[project.optional-dependencies]
examples = []

test = [
    "pytest",
    "accelerate",
    "diffusers>=0.32.0",
    "transformers",
]

libero = [
    "av",
    "huggingface-hub",
    "pyarrow",
]

[tool.pytest.ini_options]
pythonpath = [
  "."
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["mimic_video"]

[tool.hatch.build.targets.sdist]
include = [
    "mimic_video",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]
